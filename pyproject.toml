[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "folia"
version = "1.1.0"
description = "YAML → LaTeX → PDF resume generator with an ATS health-check and JD-matching toolkit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
watch = ["watchdog>=4.0"]
ats = [
    "pypdf>=3.0",
    "rapidfuzz>=3.0",
    "groq>=0.9",
    "spacy>=3.7",
]
dev = ["pytest>=8.0"]

[project.scripts]
folia-ats = "ats.cli:entrypoint"

[tool.setuptools]
packages = ["ats"]

[tool.setuptools.package-data]
ats = ["config.yml", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
